name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Node.js API ──────────────────────────────────────────────
  api:
    name: API (Node.js)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_compliance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint --workspace=apps/api

      - name: Type-check API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Run API tests
        run: npm run test --workspace=apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_compliance_test
          JWT_SECRET: test-secret-min-32-chars-long-here
          NODE_ENV: test

  # ─── React Web ────────────────────────────────────────────────
  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=apps/web

      - name: Type-check web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Build web
        run: npm run build --workspace=apps/web
        env:
          VITE_API_URL: http://localhost:4000/api/v1

  # ─── Python AI Agents ─────────────────────────────────────────
  ai-agents:
    name: AI Agents (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ai-agents/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: apps/ai-agents

      - name: Lint (ruff)
        run: pip install ruff && ruff check .
        working-directory: apps/ai-agents

      - name: Type-check (mypy)
        run: pip install mypy && mypy . --ignore-missing-imports
        working-directory: apps/ai-agents

      - name: Run tests
        run: pytest tests/ -v
        working-directory: apps/ai-agents
        env:
          ANTHROPIC_API_KEY: test-key
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
          QDRANT_URL: http://localhost:6333
          AI_AGENTS_API_KEY: test-internal

  # ─── Docker builds ─────────────────────────────────────────────
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [api, web, ai-agents]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: false
          tags: ai-sentinel/api:ci

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: false
          tags: ai-sentinel/web:ci

      - name: Build AI Agents image
        uses: docker/build-push-action@v5
        with:
          context: apps/ai-agents
          push: false
          tags: ai-sentinel/ai-agents:ci
