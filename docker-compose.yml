services:
  # ─── Infrastructure (managed by docker-compose.infra.yml for local dev) ──
  # Run infra separately: docker compose -f docker-compose.infra.yml up -d
  # This file runs only the application services.

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_db:5432/ai_compliance
      REDIS_URL: redis://redis_server:6379
      AI_AGENTS_URL: http://ai-agents:8000
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    extra_hosts:
      - "postgres_db:host-gateway"
      - "redis_server:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

  ai-agents:
    build:
      context: ./apps/ai-agents
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: apps/ai-agents/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres_db:5432/ai_compliance
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis_server:6379
    volumes:
      - ./apps/ai-agents:/app
    extra_hosts:
      - "postgres_db:host-gateway"
      - "redis_server:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
